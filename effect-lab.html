<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>🎨 이펙트 · 모형 만들기 — 구예준 STUDIO</title>
<style>
  * { box-sizing:border-box; }
  body { margin:0; background:#1c2333; color:#fff; font-family:'Malgun Gothic',sans-serif;
         display:flex; flex-direction:column; align-items:center; gap:8px;
         padding:12px 12px calc(12px + env(safe-area-inset-bottom)); }
  h1 { font-size:17px; margin:0; color:#b388ff; }
  .sub { font-size:12px; color:#9fb0d8; margin:0; text-align:center; line-height:1.6; }
  canvas { background:#0f1626; border-radius:12px; touch-action:none; max-width:100%; }
  .panel { width:100%; max-width:430px; display:flex; flex-direction:column; gap:6px; }
  .tabs { display:flex; gap:6px; width:100%; max-width:430px; }
  .tabs button { flex:1; padding:9px 4px; font-size:14px; }
  .ctl { display:flex; align-items:center; gap:8px; background:#242c44; border-radius:9px; padding:6px 10px; }
  .ctl label { font-size:12px; font-weight:800; width:70px; flex:none; color:#cfd8ff; }
  .ctl input[type=range] { flex:1; min-width:0; }
  .ctl .val { font-size:12px; font-weight:800; width:38px; text-align:right; color:#ffd54f; }
  .ctl input[type=text] { flex:1; min-width:0; background:#12182a; color:#fff; border:2px solid #3a4566;
                          border-radius:8px; padding:6px 9px; font-size:16px; font-family:inherit; }
  .ctl input[type=color] { width:44px; height:30px; border:0; background:none; padding:0; }
  .chips { display:flex; flex-wrap:wrap; gap:4px; }
  .chips button { background:#2a3358; border:0; border-radius:8px; padding:4px 7px; font-size:12px;
                  font-weight:800; color:#dbe6ff; cursor:pointer; }
  .chips button.on { background:#ffd54f; color:#2c0a16; }
  .emos { display:flex; flex-wrap:wrap; gap:4px; max-height:132px; overflow-y:auto;
          background:#1a2136; border-radius:9px; padding:6px; }
  .emos button { background:#2a3358; border:0; border-radius:7px; padding:3px 6px; font-size:18px; cursor:pointer; }
  .emos button.on { background:#ffd54f; box-shadow:0 0 0 2px #fff inset; }
  .cat { display:flex; flex-wrap:wrap; gap:4px; }
  .cat button { background:#2a3358; border:0; border-radius:7px; padding:4px 8px; font-size:11px;
                font-weight:800; color:#dbe6ff; cursor:pointer; }
  .cat button.on { background:#6a3fa0; color:#fff; }
  /* 고른 이모지 바구니 */
  #basket { display:flex; flex-wrap:wrap; gap:5px; align-items:center; background:#2d1f45;
            border:2px solid #6a3fa0; border-radius:9px; padding:6px 8px; min-height:42px; }
  #basket .pick { background:#12182a; border-radius:8px; padding:3px 7px; font-size:20px; cursor:pointer;
                  border:0; color:#fff; position:relative; }
  #basket .pick:after { content:'✕'; font-size:9px; color:#ff8a80; margin-left:3px; vertical-align:top; }
  #basket .empty { font-size:12px; color:#b39ddb; }
  /* 예준이가 그린 이펙트 그림 */
  #pics { display:flex; flex-wrap:wrap; gap:5px; align-items:center; }
  #pics .pic { position:relative; background:#12182a; border:2px solid #3a4566; border-radius:8px;
               padding:2px; cursor:pointer; line-height:0; }
  #pics .pic.on { border-color:#ffd54f; }
  #pics img { width:40px; height:40px; object-fit:contain;
              background:repeating-conic-gradient(#2a3358 0 25%,#1a2136 0 50%) 0 0/10px 10px; border-radius:6px; }
  #pics .nm { font-size:9px; color:#9fb0d8; text-align:center; max-width:44px; overflow:hidden;
              white-space:nowrap; text-overflow:ellipsis; line-height:1.3; }
  .row { display:flex; gap:6px; flex-wrap:wrap; justify-content:center; }
  button { background:#3f6ea8; color:#fff; border:0; border-radius:9px;
           padding:9px 14px; font-size:13px; font-weight:800; cursor:pointer; }
  .on { background:#ffd54f; color:#2c0a16; }
  #out { width:100%; max-width:430px; background:#12182a; border:2px solid #6a3fa0; border-radius:10px;
         padding:10px; font-size:12px; line-height:1.7; color:#e1d4ff; white-space:pre-wrap; }
  .hide { display:none !important; }
</style>

<h1>🎨 이펙트 · 모형 만들기</h1>
<p class="sub">코딩 없이 만들어요 — 다 되면 <b>[📋 설정 복사]</b> 눌러 클로드에게 주세요</p>

<div class="tabs">
  <button id="tabFx" class="on">✨ 이펙트</button>
  <button id="tabMd">🛡️ 모형</button>
</div>

<canvas id="cv" width="360" height="360"></canvas>

<!-- ── 이펙트 ── -->
<div class="panel" id="panelFx">
  <div class="ctl" style="padding:6px 8px"><label>움직임</label><div class="chips" id="motions"></div></div>
  <div class="ctl" style="padding:6px 8px"><label>선(진)</label><div class="chips" id="lines"></div></div>
  <div class="ctl" id="lineOpts"><label>선 색</label><input type="color" id="linecol" value="#7e3ff2">
    <label style="width:auto">바닥</label><input type="color" id="fillcol" value="#0d0616">
    <button id="linefill" style="padding:5px 9px;font-size:11px">바닥 채움</button></div>
  <div class="ctl" id="lineOpts2"><label>선 굵기</label><input type="range" id="linew" min="1" max="9" value="3"><span class="val" id="vlinew"></span></div>
  <div class="ctl" id="lineOpts3"><label>선 크기</label><input type="range" id="liner" min="30" max="180" value="110"><span class="val" id="vliner"></span></div>
  <div class="ctl" id="lineOpts4"><label>선 회전</label><input type="range" id="linespin" min="0" max="10" value="2"><span class="val" id="vlinespin"></span></div>
  <div class="ctl" style="padding:6px 8px">
    <label>그림</label>
    <input type="file" id="picFile" accept="image/*" multiple style="display:none">
    <button id="picBtn" style="padding:6px 10px;font-size:12px">📷 그림 넣기</button>
    <button id="picBg" style="padding:6px 10px;font-size:12px">🩹 흰 배경 지우기</button>
  </div>
  <div id="pics"></div>
  <div id="basket"></div>
  <div class="cat" id="cats"></div>
  <div class="emos" id="quick"></div>
  <div class="ctl"><label>직접 넣기</label><input type="text" id="emo" placeholder="이모지 붙여넣고 엔터" maxlength="8"></div>
  <div class="ctl"><label>개수</label><input type="range" id="count" min="1" max="40" value="8"><span class="val" id="vcount"></span></div>
  <div class="ctl"><label>크기</label><input type="range" id="size" min="8" max="70" value="24"><span class="val" id="vsize"></span></div>
  <div class="ctl"><label>퍼짐</label><input type="range" id="spread" min="0" max="160" value="70"><span class="val" id="vspread"></span></div>
  <div class="ctl"><label>회전</label><input type="range" id="spin" min="0" max="20" value="6"><span class="val" id="vspin"></span></div>
  <div class="ctl"><label>지속</label><input type="range" id="life" min="3" max="40" value="12"><span class="val" id="vlife"></span></div>
  <div class="ctl"><label>중력</label><input type="range" id="grav" min="0" max="100" value="0"><span class="val" id="vgrav"></span></div>
  <div class="row">
    <button id="ring">⭕ 원 테두리</button>
    <button id="flash">✨ 번쩍임</button>
    <button id="rise">⬆️ 위로 솟기</button>
  </div>
  <div class="row">
    <button id="trail">💨 꼬리</button>
    <button id="grow">🔍 점점 커짐</button>
    <button id="fade">🌫️ 점점 사라짐</button>
  </div>
  <div class="ctl"><label>원 색</label><input type="color" id="ringcol" value="#ff5252"><span class="val" id="vringcol"></span></div>
</div>

<!-- ── 모형 ── -->
<div class="panel hide" id="panelMd">
  <div class="ctl"><label>몸 모양</label><div class="chips" id="bodyShape"></div></div>
  <div class="ctl"><label>몸 색</label><input type="color" id="bodyCol" value="#1a0b2e">
    <label style="width:auto">테두리</label><input type="color" id="lineCol" value="#b388ff"></div>
  <div class="ctl"><label>눈</label><div class="chips" id="eyeType"></div></div>
  <div class="ctl"><label>손에</label><div class="chips" id="handType"></div></div>
  <div class="ctl"><label>머리</label><div class="chips" id="headType"></div></div>
  <div class="ctl"><label>크기</label><input type="range" id="mSize" min="12" max="70" value="30"><span class="val" id="vmSize"></span></div>
  <div class="ctl"><label>몇 기</label><input type="range" id="mCount" min="1" max="6" value="3"><span class="val" id="vmCount"></span></div>
  <div class="row">
    <button id="aura">🟣 발밑 오라</button>
    <button id="drop">⬇️ 위에서 강림</button>
    <button id="bob">🎈 둥실둥실</button>
  </div>
  <div class="ctl"><label>오라 색</label><input type="color" id="auraCol" value="#7e3ff2"><span class="val" id="vauraCol"></span></div>
</div>

<div class="row">
  <button id="again">▶️ 다시 보기</button>
  <button id="slow">🐢 느리게</button>
  <button id="copy">📋 설정 복사</button>
  <button id="back" style="background:#3a4566">← 게임으로</button>
</div>

<div id="out"></div>

<script>
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
const ENEMIES = [{ x: 110, y: 110 }, { x: 180, y: 168 }, { x: 250, y: 110 }, { x: 180, y: 250 }];

/* ── 이모지 (카테고리별) ── */
const EMOJI = {
  '불·폭발': ['🔥','💥','💢','☄️','🎆','🎇','✨','💫','🌟','⭐','🧨','💣','🌋','🕯️','♨️','🔆','🎃','🥌'],
  '얼음·물': ['❄️','🧊','💧','🫧','🌊','💦','☔','🥶','🌨️','⛄','🏔️','🌧️','🚿','🧼','🩵'],
  '번개·바람': ['⚡','🌀','💨','🌪️','☁️','🌫️','🎐','🪁','🍃','🌬️'],
  '자연': ['🍃','🌸','🌺','🌷','🍂','🌿','🌱','🪶','🍀','🌻','🌵','🌳','🌴','🎋','🌾','🪷','🍁','🌼','🪻','🌰','🪵'],
  '무기': ['🗡️','⚔️','🏹','🪓','🔨','🪃','🛡️','🔱','🥊','👊','🤛','🔫','⛏️','🪚','🔪','🏏','🥍','🪤'],
  '어둠·죽음': ['💀','☠️','👻','🕷️','🕸️','🩸','🖤','🦇','⚰️','😈','👹','👺','🧟','🌑','🦴','🫥','🕳️'],
  '빛·신성': ['🌞','☀️','🌙','💛','🔆','😇','🪽','🕊️','🔮','📿','⛪','🙏','🪬','🌠','🌈','💫','🔯','☯️'],
  '마음·표정': ['❤️','💔','💖','💘','😡','😱','😵','🤢','😤','🥵','💤','🥺','😭','🤬','🫠','🤯','💯','😎','🤪','🫨'],
  '음식': ['🍡','🍜','🍕','🍎','🍇','🥔','🌰','🍪','🍬','🥟','🍖','🥚','🍔','🌭','🍟','🍰','🧁','🍩','🍭','🥨','🍿','🥞','🍦','🍺'],
  '동물': ['🐍','🦴','🐾','🦋','🐝','🦈','🐙','🦂','🐺','🦅','🐲','🐉','🦖','🦕','🐢','🐌','🐜','🦗','🐡','🦑','🐕','🐈','🐧','🦉'],
  '기타': ['🎵','🎶','🔔','💰','⚙️','🌐','🎲','🃏','🔑','📜','⏳','🧲','💎','🏆','🎁','📦','🔩','🪙','🎯','🧿','♟️','🎪','🎨','🩹','🛞','🧬'],
  '기호': ['‼️','⁉️','❓','❗','⭕','❌','🚫','✅','💠','🔷','🔶','🟥','🟦','🟨','🟩','🟪','⬛','⬜','♦️','♠️'],
};
let curCat = '불·폭발';
$('cats').innerHTML = Object.keys(EMOJI).map(c => `<button data-c="${c}">${c}</button>`).join('');

/* ── 움직임 패턴 ── */
const MOTIONS = ['퍼짐','소용돌이','궤도','비','분수','회오리','파도','돌진','제자리',
                 '수렴','8자','지그재그','흔들림','무작위','뱀','튕김'];
const LINES = ['없음','눈꽃','별','오각진','그물','방사선','나선','육각','십자','이중원'];
$('motions').innerHTML = MOTIONS.map(m => `<button data-m="${m}">${m}</button>`).join('');
$('lines').innerHTML = LINES.map(l => `<button data-l="${l}">${l}</button>`).join('');

/* ── 모형 파츠 ── */
const PARTS = {
  bodyShape: ['방패꼴','원','사각','삼각','별','물방울'],
  eyeType:   ['없음','점 두개','가로 틈','반짝','한 눈'],
  handType:  ['없음','검','방망이','창','지팡이','도끼'],
  headType:  ['없음','뿔','투구','후광','깃털'],
};
const md = { bodyShape:'방패꼴', eyeType:'가로 틈', handType:'검', headType:'없음',
             bodyCol:'#1a0b2e', lineCol:'#b388ff', mSize:30, mCount:3,
             aura:true, drop:true, bob:false, auraCol:'#7e3ff2' };
for (const key in PARTS) {
  $(key).innerHTML = PARTS[key].map(v => `<button data-v="${v}">${v}</button>`).join('');
  $(key).onclick = ev => { const v = ev.target.dataset.v; if (v) { md[key] = v; sync(); fire(180, 168); } };
}

/* ── 이펙트 옵션 ── */
let PICS = [];      // 예준이가 그린 이펙트 그림 (128x128로 줄여 보관)
let picBg = true;   // 흰 배경을 지울지
const fx = { line:'없음', linecol:'#7e3ff2', linew:3, liner:110, linespin:2, linefill:true, fillcol:'#0d0616',
             emos:['🔥'], pics:[], motion:'퍼짐', count:8, size:24, spread:70, spin:6, life:12, grav:0,
             ring:true, flash:false, rise:false, trail:false, grow:false, fade:true, ringcol:'#ff5252' };
let mode = 'fx', effects = [], TIME = 0, speed = 1;
const MAX_PICK = 8;

/* 이모지 고르기 — 눌러서 담고, 바구니에서 눌러서 뺀다 */
function toggleEmo(e) {
  const i = fx.emos.indexOf(e);
  if (i >= 0) { if (fx.emos.length > 1) fx.emos.splice(i, 1); }
  else if (fx.emos.length < MAX_PICK) fx.emos.push(e);
  loadPics(); paintPics(); paintCat(); sync(); fire(180, 168);
}
function paintCat() {
  $('cats').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.c === curCat));
  $('quick').innerHTML = EMOJI[curCat]
    .map(e => `<button data-e="${e}" class="${fx.emos.includes(e) ? 'on' : ''}">${e}</button>`).join('');
  $('motions').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.m === fx.motion));
  $('lines').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.l === fx.line));
  $('basket').innerHTML = fx.emos.length
    ? fx.emos.map(e => `<button class="pick" data-e="${e}">${e}</button>`).join('')
      + `<span class="empty">이모지를 눌러 담고, 여기서 눌러 빼요 (최대 ${MAX_PICK})</span>`
    : `<span class="empty">아래에서 이모지를 골라주세요</span>`;
}
$('cats').onclick = ev => { const c = ev.target.dataset.c; if (c) { curCat = c; paintCat(); } };
$('quick').onclick = ev => { const e = ev.target.dataset.e; if (e) toggleEmo(e); };
$('basket').onclick = ev => { const e = ev.target.dataset.e; if (e) toggleEmo(e); };
$('motions').onclick = ev => { const m = ev.target.dataset.m; if (m) { fx.motion = m; paintCat(); sync(); fire(180,168); } };
$('lines').onclick = ev => { const l = ev.target.dataset.l; if (l) { fx.line = l; paintCat(); sync(); fire(180,168); } };
$('linefill').onclick = () => { fx.linefill = !fx.linefill; sync(); fire(180,168); };
$('emo').onchange = () => { const v = $('emo').value.trim(); if (v) { toggleEmo(v); $('emo').value = ''; } };

const fxSliders = ['count','size','spread','spin','life','grav','linew','liner','linespin'];
const mdSliders = ['mSize','mCount'];
const fxToggles = ['ring','flash','rise','trail','grow','fade'];
function sync() {
  for (const k of fxSliders) { fx[k] = +$(k).value; $('v'+k).textContent = $(k).value; }
  fx.ringcol = $('ringcol').value; $('vringcol').textContent = '';
  fx.linecol = $('linecol').value; fx.fillcol = $('fillcol').value;
  $('linefill').classList.toggle('on', fx.linefill);
  const lineOn = fx.line !== '없음';
  for (const id of ['lineOpts','lineOpts2','lineOpts3','lineOpts4']) $(id).classList.toggle('hide', !lineOn);
  for (const k of fxToggles) $(k).classList.toggle('on', fx[k]);
  for (const k of mdSliders) { md[k] = +$(k).value; $('v'+k).textContent = $(k).value; }
  md.bodyCol = $('bodyCol').value; md.lineCol = $('lineCol').value; md.auraCol = $('auraCol').value;
  for (const k of ['aura','drop','bob']) $(k).classList.toggle('on', md[k]);
  for (const key in PARTS)
    $(key).querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === md[key]));
  render();
}
for (const k of fxSliders) $(k).oninput = sync;
for (const k of mdSliders) $(k).oninput = sync;
for (const k of ['ringcol','bodyCol','lineCol','auraCol','linecol','fillcol']) $(k).oninput = sync;
for (const k of fxToggles) $(k).onclick = () => { fx[k] = !fx[k]; sync(); fire(180,168); };
for (const k of ['aura','drop','bob']) $(k).onclick = () => { md[k] = !md[k]; sync(); fire(180,168); };

$('tabFx').onclick = () => setMode('fx');
$('tabMd').onclick = () => setMode('md');
function setMode(m) {
  mode = m;
  $('tabFx').classList.toggle('on', m === 'fx');
  $('tabMd').classList.toggle('on', m === 'md');
  $('panelFx').classList.toggle('hide', m !== 'fx');
  $('panelMd').classList.toggle('hide', m !== 'md');
  effects = []; fire(180, 168); sync();
}

function fire(x, y) { effects.push({ x, y, t: 1, seed: Math.random() * 1000 }); }
cv.addEventListener('pointerdown', ev => {
  const b = cv.getBoundingClientRect();
  fire((ev.clientX - b.left) * cv.width / b.width, (ev.clientY - b.top) * cv.height / b.height);
});
$('again').onclick = () => fire(180, 168);
$('back').onclick = () => { location.href = 'index.html'; };
$('slow').onclick = e => { speed = speed === 1 ? 0.25 : 1;
  e.target.textContent = speed === 1 ? '🐢 느리게' : '🐇 보통 속도'; };
$('copy').onclick = () => {
  const onoff = b => b ? '켬' : '끔';
  const txt = mode === 'fx'
    ? `✨ 이펙트 설정\n이모지: ${fx.emos.join(' ') || '(없음)'}\n`
      + (fx.pics.length ? `그림: ${fx.pics.map(i => PICS[i] && PICS[i].name).filter(Boolean).join(', ')} (예준이 그림 — 파일도 함께 보내주세요)\n` : '')
      + `움직임: ${fx.motion}\n`
      + `선(진): ${fx.line}` + (fx.line !== '없음'
          ? ` · 선색 ${fx.linecol} · 굵기 ${fx.linew} · 크기 ${fx.liner} · 회전 ${fx.linespin} · 바닥 ${fx.linefill ? '채움 ' + fx.fillcol : '없음'}`
          : '') + `\n`
      + `개수: ${fx.count}\n크기: ${fx.size}\n`
      + `퍼짐: ${fx.spread}\n회전: ${fx.spin}\n지속: ${fx.life}\n중력: ${fx.grav}\n`
      + `원 테두리: ${fx.ring ? '켬 ' + fx.ringcol : '끔'}\n번쩍임: ${onoff(fx.flash)}\n위로 솟기: ${onoff(fx.rise)}\n`
      + `꼬리: ${onoff(fx.trail)}\n점점 커짐: ${onoff(fx.grow)}\n점점 사라짐: ${onoff(fx.fade)}`
    : `🛡️ 모형 설정\n몸 모양: ${md.bodyShape}\n몸 색: ${md.bodyCol}\n테두리 색: ${md.lineCol}\n눈: ${md.eyeType}\n손에: ${md.handType}\n머리: ${md.headType}\n크기: ${md.mSize}\n몇 기: ${md.mCount}\n발밑 오라: ${md.aura ? '켬 ' + md.auraCol : '끔'}\n위에서 강림: ${onoff(md.drop)}\n둥실둥실: ${onoff(md.bob)}`;
  navigator.clipboard && navigator.clipboard.writeText(txt).catch(() => {});
  $('out').textContent = txt + '\n\n📋 복사했어요! 클로드에게 붙여넣고\n어느 캐릭터·기술에 넣을지 말해주세요.';
};
function render() {
  $('out').textContent = mode === 'fx'
    ? `${fx.emos.join('')}${fx.pics.length ? '🖼️×' + fx.pics.length : ''} ${fx.count}개 · ${fx.motion} · 크기 ${fx.size} · 퍼짐 ${fx.spread}` +
      (fx.ring ? ' · 원' : '') + (fx.flash ? ' · 번쩍임' : '') + (fx.rise ? ' · 위로' : '') +
      (fx.trail ? ' · 꼬리' : '') + (fx.grow ? ' · 커짐' : '') + (fx.line !== '없음' ? ' · 진:' + fx.line : '')
    : `${md.bodyShape} ${md.mCount}기 · 눈 ${md.eyeType} · 손 ${md.handType} · 머리 ${md.headType}` +
      (md.aura ? ' · 오라' : '') + (md.drop ? ' · 강림' : '');
}

/* ── 그림 불러오기 ── */
const PIC_SIZE = 128;
function shrinkPic(img) {          // 128x128로 줄이고, 원하면 흰 배경을 투명하게
  const c = document.createElement('canvas'); c.width = c.height = PIC_SIZE;
  const x = c.getContext('2d');
  const sc = Math.min(PIC_SIZE / img.width, PIC_SIZE / img.height);
  const w = img.width * sc, h = img.height * sc;
  x.drawImage(img, (PIC_SIZE - w) / 2, (PIC_SIZE - h) / 2, w, h);
  if (picBg) {
    const d = x.getImageData(0, 0, PIC_SIZE, PIC_SIZE), p2 = d.data;
    for (let i = 0; i < p2.length; i += 4) {
      const r = p2[i], g2 = p2[i+1], b2 = p2[i+2];
      if (r > 205 && g2 > 205 && b2 > 205 && Math.max(r,g2,b2) - Math.min(r,g2,b2) < 30) p2[i+3] = 0;
    }
    x.putImageData(d, 0, 0);
  }
  return c.toDataURL('image/png');
}
function addPic(file) {
  const fr = new FileReader();
  fr.onload = () => {
    const img = new Image();
    img.onload = () => {
      const url = shrinkPic(img);
      const el = new Image(); el.src = url;
      PICS.push({ name: file.name.replace(/\.[^.]+$/, ''), url, el });
      savePics(); paintPics(); sync();
    };
    img.src = fr.result;
  };
  fr.readAsDataURL(file);
}
function savePics() {              // 용량이 크면 저장을 건너뛴다 (미리보기는 그대로 됨)
  try { localStorage.setItem('lab_pics', JSON.stringify(PICS.map(p => ({ name: p.name, url: p.url })))); }
  catch (e) {}
}
function loadPics() {
  try {
    const arr = JSON.parse(localStorage.getItem('lab_pics') || '[]');
    PICS = arr.map(p => { const el = new Image(); el.src = p.url; return { ...p, el }; });
  } catch (e) { PICS = []; }
}
function picKey(i) { return '#' + i; }
function paintPics() {
  $('pics').innerHTML = PICS.map((p, i) =>
    `<div class="pic ${fx.pics.includes(i) ? 'on' : ''}" data-i="${i}">
       <img src="${p.url}"><div class="nm">${p.name}</div></div>`).join('')
    + (PICS.length ? '' : '<span style="font-size:11px;color:#7d8ab0">예준이가 그린 이펙트를 넣어보세요</span>');
  $('picBg').classList.toggle('on', picBg);
}
$('picBtn').onclick = () => $('picFile').click();
$('picFile').onchange = ev => { for (const f of ev.target.files) addPic(f); ev.target.value = ''; };
$('picBg').onclick = () => { picBg = !picBg; paintPics(); };
$('pics').onclick = ev => {
  const el = ev.target.closest('.pic'); if (!el) return;
  const i = +el.dataset.i;
  const at = fx.pics.indexOf(i);
  if (at >= 0) fx.pics.splice(at, 1); else fx.pics.push(i);
  paintPics(); sync(); fire(180, 168);
};

/* ── 그리기 ── */
const rnd = n => { const s = Math.sin(n * 127.1) * 43758.5453; return s - Math.floor(s); };

// 알갱이 하나의 위치 — 움직임 패턴별 계산
function partPos(i, n, grow, e) {
  const base = (i / n) * Math.PI * 2;
  const R = fx.spread, sd = e.seed;
  switch (fx.motion) {
    case '소용돌이': { const a = base + grow * 5; return [e.x + Math.cos(a) * R * grow, e.y + Math.sin(a) * R * grow]; }
    case '궤도':    { const a = base + TIME * 2.2; return [e.x + Math.cos(a) * R, e.y + Math.sin(a) * R]; }
    case '비':      { const rx = (rnd(i + sd) - 0.5) * R * 2.2;
                      return [e.x + rx, e.y - R * 1.1 + grow * R * 2.4 + rnd(i + sd + 9) * 20]; }
    case '분수':    { const vx = (rnd(i + sd) - 0.5) * 2.2, up = 1.5;
                      return [e.x + vx * R * grow, e.y - R * up * grow + R * 2.1 * grow * grow]; }
    case '회오리':  { const a = base + grow * 9, r = R * (1 - grow * 0.75);
                      return [e.x + Math.cos(a) * r, e.y + R * 0.5 - grow * R * 1.7]; }
    case '파도':    { const t = i / n - 0.5;
                      return [e.x + t * R * 2 + (grow - 0.5) * R, e.y + Math.sin(grow * 7 + i * 0.9) * R * 0.4]; }
    case '돌진':    { return [e.x - R * 1.2 + grow * R * 2.6, e.y + (i / n - 0.5) * R * 0.9]; }
    case '제자리':  { const w = 1 + Math.sin(TIME * 9 + i) * 0.18;
                      return [e.x + Math.cos(base) * R * 0.28 * w, e.y + Math.sin(base) * R * 0.28 * w]; }
    case '수렴':    { const d2 = R * (1 - grow);                       // 밖에서 안으로 모여든다
                      return [e.x + Math.cos(base) * d2, e.y + Math.sin(base) * d2]; }
    case '8자':     { const a = base + TIME * 2;                       // 무한대 모양 궤도
                      return [e.x + Math.cos(a) * R, e.y + Math.sin(a * 2) * R * 0.5]; }
    case '지그재그': { const d2 = R * grow, z = (i % 2 ? 1 : -1) * Math.sin(grow * 10) * R * 0.28;
                      return [e.x + Math.cos(base) * d2 + Math.cos(base + Math.PI / 2) * z,
                              e.y + Math.sin(base) * d2 + Math.sin(base + Math.PI / 2) * z]; }
    case '흔들림':  { const ph = Math.sin(TIME * 18 + i * 0.7) * R * 0.3;
                      return [e.x + Math.cos(base) * R * 0.35 + ph, e.y + Math.sin(base) * R * 0.35]; }
    case '무작위':  { const a = rnd(i + sd) * Math.PI * 2, sp = 0.45 + rnd(i + sd + 3);
                      return [e.x + Math.cos(a) * R * grow * sp, e.y + Math.sin(a) * R * grow * sp]; }
    case '뱀':      { const a = grow * 6 - (i / n) * 1.5;              // 한 줄로 꼬리를 물고 간다
                      return [e.x + Math.cos(a) * R, e.y + Math.sin(a) * R]; }
    case '튕김':    { const t2 = grow * 3 + i * 0.12, bnc = Math.abs(Math.sin(t2 * Math.PI));
                      return [e.x + (i / n - 0.5) * R * 1.8, e.y + R * 0.6 - bnc * R]; }
    default:        return [e.x + Math.cos(base) * R * grow, e.y + Math.sin(base) * R * grow]; // 퍼짐
  }
}

// 진(陣) — 검사 하이퍼차지의 눈꽃 진 같은 선 연출
function drawLines(e, grow) {
  if (fx.line === '없음') return;
  const R = fx.liner * (0.6 + grow * 0.4);
  ctx.save(); ctx.translate(e.x, e.y); ctx.rotate(TIME * fx.linespin * 0.2);
  if (fx.linefill) {
    ctx.globalAlpha = e.t * 0.4; ctx.fillStyle = fx.fillcol;
    ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = e.t;
  ctx.strokeStyle = fx.linecol; ctx.lineWidth = fx.linew;
  const poly = (n, r, rot) => { ctx.beginPath();
    for (let i = 0; i <= n; i++) { const a = rot + i * Math.PI * 2 / n;
      ctx[i ? 'lineTo' : 'moveTo'](Math.cos(a) * r, Math.sin(a) * r); } ctx.stroke(); };
  const spokes = n => { for (let i = 0; i < n; i++) { const a = i * Math.PI * 2 / n;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(a) * R, Math.sin(a) * R); ctx.stroke(); } };
  switch (fx.line) {
    case '눈꽃':
      ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.arc(0, 0, R * 0.72, 0, Math.PI * 2); ctx.stroke();
      for (let i = 0; i < 6; i++) { const a = i * Math.PI / 3;
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(a) * R, Math.sin(a) * R); ctx.stroke();
        for (const f of [0.45, 0.7]) { const bx = Math.cos(a) * R * f, by = Math.sin(a) * R * f;
          for (const s2 of [-0.5, 0.5]) { ctx.beginPath(); ctx.moveTo(bx, by);
            ctx.lineTo(bx + Math.cos(a + s2) * R * 0.16, by + Math.sin(a + s2) * R * 0.16); ctx.stroke(); } } }
      break;
    case '별': ctx.beginPath();
      for (let i = 0; i < 11; i++) { const r = i % 2 ? R * 0.42 : R, a = i * Math.PI / 5 - Math.PI / 2;
        ctx[i ? 'lineTo' : 'moveTo'](Math.cos(a) * r, Math.sin(a) * r); } ctx.stroke(); break;
    case '오각진':
      poly(5, R, -Math.PI / 2);
      ctx.beginPath();                                    // 안쪽 오각별 (한 붓 그리기)
      for (let i = 0; i <= 5; i++) { const a = -Math.PI / 2 + (i * 2) * Math.PI * 2 / 5;
        ctx[i ? 'lineTo' : 'moveTo'](Math.cos(a) * R * 0.92, Math.sin(a) * R * 0.92); } ctx.stroke();
      break;
    case '그물':
      ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2); ctx.stroke();
      for (let i = 0; i < 12; i++) { const a1 = i * Math.PI * 2 / 12, a2 = a1 + Math.PI * 2 * 5 / 12;
        ctx.beginPath(); ctx.moveTo(Math.cos(a1) * R, Math.sin(a1) * R);
        ctx.lineTo(Math.cos(a2) * R, Math.sin(a2) * R); ctx.stroke(); }
      break;
    case '방사선': spokes(16); break;
    case '나선':
      ctx.beginPath();
      for (let i = 0; i <= 140; i++) { const t2 = i / 140, a = t2 * Math.PI * 6, r = R * t2;
        ctx[i ? 'lineTo' : 'moveTo'](Math.cos(a) * r, Math.sin(a) * r); } ctx.stroke();
      break;
    case '육각': poly(6, R, 0); poly(6, R * 0.62, Math.PI / 6); spokes(6); break;
    case '십자':
      ctx.beginPath(); ctx.arc(0, 0, R * 0.8, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-R, 0); ctx.lineTo(R, 0); ctx.moveTo(0, -R); ctx.lineTo(0, R); ctx.stroke();
      break;
    case '이중원':
      for (const f of [1, 0.74, 0.48]) { ctx.beginPath(); ctx.arc(0, 0, R * f, 0, Math.PI * 2); ctx.stroke(); }
      break;
  }
  ctx.globalAlpha = 1; ctx.restore();
}
function drawFx(e) {
  const grow = 1 - e.t;
  drawLines(e, grow);                                     // 진(陣)을 먼저 깔고 그 위에 알갱이
  const baseA = fx.fade ? e.t : 1;
  const alpha = fx.flash ? Math.abs(Math.sin(TIME * 14)) * baseA : baseA;
  if (fx.ring) {
    ctx.strokeStyle = fx.ringcol; ctx.globalAlpha = e.t; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(e.x, e.y, fx.spread * grow, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const sizeNow = fx.size * (fx.grow ? 0.45 + grow * 1.1 : 1);
  const steps = fx.trail ? 4 : 1;                        // 꼬리: 조금 전 위치를 흐리게 겹쳐 그린다
  const items = [...fx.emos, ...fx.pics.map(picKey)];     // 이모지와 그림을 섞어 쓴다
  if (!items.length) items.push('🔥');
  for (let i = 0; i < fx.count; i++) {
    const emo = items[i % items.length];
    for (let s = steps - 1; s >= 0; s--) {
      const g2 = Math.max(0, grow - s * 0.06);
      const [x, y0] = partPos(i, fx.count, g2, e);
      const y = y0 - (fx.rise ? g2 * 60 : 0) + (fx.grav / 100) * 260 * g2 * g2;
      ctx.save(); ctx.translate(x, y); ctx.rotate(TIME * fx.spin + (i / fx.count) * Math.PI * 2);
      ctx.globalAlpha = alpha * (s === 0 ? 1 : 0.22);
      const sz2 = sizeNow * (s === 0 ? 1 : 0.8);
      if (emo[0] === '#') {                               // 그림 알갱이
        const pic = PICS[+emo.slice(1)];
        if (pic && pic.el.complete && pic.el.naturalWidth) ctx.drawImage(pic.el, -sz2 / 2, -sz2 / 2, sz2, sz2);
      } else {
        ctx.font = `${sz2}px sans-serif`;
        ctx.fillText(emo, 0, 0);
      }
      ctx.restore();
    }
  }
  ctx.globalAlpha = 1; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
}

function bodyPath(S) {
  ctx.beginPath();
  const s = S;
  switch (md.bodyShape) {
    case '원':    ctx.arc(0, 0, s * 0.5, 0, Math.PI * 2); break;
    case '사각':  ctx.rect(-s * 0.42, -s * 0.5, s * 0.84, s); break;
    case '삼각':  ctx.moveTo(0, -s * 0.55); ctx.lineTo(s * 0.5, s * 0.45); ctx.lineTo(-s * 0.5, s * 0.45); ctx.closePath(); break;
    case '별':    for (let i = 0; i < 10; i++) { const r = i % 2 ? s * 0.24 : s * 0.55, a = i * Math.PI / 5 - Math.PI / 2;
                    ctx[i ? 'lineTo' : 'moveTo'](Math.cos(a) * r, Math.sin(a) * r); } ctx.closePath(); break;
    case '물방울':ctx.moveTo(0, -s * 0.6); ctx.quadraticCurveTo(s * 0.5, 0, 0, s * 0.5);
                  ctx.quadraticCurveTo(-s * 0.5, 0, 0, -s * 0.6); break;
    default:      ctx.moveTo(0, -s * 0.55); ctx.lineTo(s * 0.32, -s * 0.13); ctx.lineTo(s * 0.25, s * 0.42);
                  ctx.lineTo(-s * 0.25, s * 0.42); ctx.lineTo(-s * 0.32, -s * 0.13); ctx.closePath();
  }
}
function drawModel(e) {
  const grow = 1 - e.t;
  for (let i = 0; i < md.mCount; i++) {
    const gap = 78;
    const bx = e.x + (i - (md.mCount - 1) / 2) * gap;
    const drop = md.drop ? Math.max(0, (0.35 - grow) / 0.35) * 90 : 0;
    const bob = md.bob ? Math.sin(TIME * 4 + i) * 5 : 0;
    const by = e.y - drop + bob;
    const S = md.mSize;
    if (md.aura && drop <= 0) {
      const pr = S * 0.55 + Math.sin(TIME * 5 + i) * 3;
      ctx.fillStyle = md.auraCol + '55';
      ctx.beginPath(); ctx.ellipse(bx, by + S * 0.5, pr + 5, (pr + 5) * 0.42, 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = md.auraCol; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.ellipse(bx, by + S * 0.5, pr, pr * 0.42, 0, 0, Math.PI * 2); ctx.stroke();
    }
    if (drop > 0) { ctx.strokeStyle = md.lineCol + '88'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(bx, by - 40); ctx.lineTo(bx, by); ctx.stroke(); }
    ctx.save(); ctx.translate(bx, by); ctx.globalAlpha = Math.min(1, e.t * 1.5);
    ctx.fillStyle = md.bodyCol; ctx.strokeStyle = md.lineCol; ctx.lineWidth = 2;
    bodyPath(S); ctx.fill(); ctx.stroke();
    // 눈
    ctx.fillStyle = '#e1bee7';
    if (md.eyeType === '점 두개') { ctx.beginPath(); ctx.arc(-S*0.15,-S*0.15,S*0.06,0,7); ctx.arc(S*0.15,-S*0.15,S*0.06,0,7); ctx.fill(); }
    else if (md.eyeType === '가로 틈') { ctx.fillRect(-S*0.22,-S*0.2,S*0.16,S*0.07); ctx.fillRect(S*0.06,-S*0.2,S*0.16,S*0.07); }
    else if (md.eyeType === '반짝') { ctx.font = `${S*0.4}px sans-serif`; ctx.textAlign='center'; ctx.fillText('✨',0,-S*0.08); ctx.textAlign='left'; }
    else if (md.eyeType === '한 눈') { ctx.beginPath(); ctx.arc(0,-S*0.15,S*0.13,0,7); ctx.fill();
      ctx.fillStyle = md.bodyCol; ctx.beginPath(); ctx.arc(0,-S*0.15,S*0.06,0,7); ctx.fill(); }
    // 손에 든 것
    ctx.strokeStyle = md.lineCol; ctx.lineCap = 'round';
    if (md.handType === '검') { ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(S*0.32,-S*0.05); ctx.lineTo(S*0.78,-S*0.5); ctx.stroke(); }
    else if (md.handType === '방망이') { ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(S*0.3,0); ctx.lineTo(S*0.72,-S*0.42); ctx.stroke(); }
    else if (md.handType === '창') { ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(S*0.25,S*0.35); ctx.lineTo(S*0.6,-S*0.62); ctx.stroke();
      ctx.fillStyle = md.lineCol; ctx.beginPath(); ctx.moveTo(S*0.6,-S*0.72); ctx.lineTo(S*0.7,-S*0.5); ctx.lineTo(S*0.5,-S*0.5); ctx.fill(); }
    else if (md.handType === '지팡이') { ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(S*0.28,S*0.4); ctx.lineTo(S*0.42,-S*0.5); ctx.stroke();
      ctx.fillStyle = md.auraCol; ctx.beginPath(); ctx.arc(S*0.44,-S*0.58,S*0.13,0,7); ctx.fill(); }
    else if (md.handType === '도끼') { ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(S*0.28,S*0.2); ctx.lineTo(S*0.6,-S*0.45); ctx.stroke();
      ctx.fillStyle = md.lineCol; ctx.beginPath(); ctx.arc(S*0.62,-S*0.48,S*0.2,Math.PI*0.6,Math.PI*1.7); ctx.fill(); }
    // 머리
    ctx.fillStyle = md.lineCol;
    if (md.headType === '뿔') { ctx.beginPath(); ctx.moveTo(-S*0.3,-S*0.45); ctx.lineTo(-S*0.42,-S*0.8); ctx.lineTo(-S*0.16,-S*0.52); ctx.fill();
      ctx.beginPath(); ctx.moveTo(S*0.3,-S*0.45); ctx.lineTo(S*0.42,-S*0.8); ctx.lineTo(S*0.16,-S*0.52); ctx.fill(); }
    else if (md.headType === '투구') { ctx.beginPath(); ctx.arc(0,-S*0.45,S*0.3,Math.PI,Math.PI*2); ctx.fill(); }
    else if (md.headType === '후광') { ctx.strokeStyle='#ffd54f'; ctx.lineWidth=3;
      ctx.beginPath(); ctx.ellipse(0,-S*0.72,S*0.32,S*0.11,0,0,Math.PI*2); ctx.stroke(); }
    else if (md.headType === '깃털') { ctx.beginPath(); ctx.ellipse(S*0.1,-S*0.72,S*0.07,S*0.26,0.5,0,Math.PI*2); ctx.fill(); }
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000) * speed;
  last = now; TIME += dt;
  ctx.fillStyle = '#0f1626'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.font = '24px sans-serif'; ctx.textAlign = 'center';
  for (const en of ENEMIES) ctx.fillText('👾', en.x, en.y + 8);
  ctx.textAlign = 'left';
  for (let i = effects.length - 1; i >= 0; i--) {
    const e = effects[i];
    e.t -= dt * (mode === 'fx' ? 30 / fx.life : 0.35);
    if (e.t <= 0) { effects.splice(i, 1); continue; }
    ctx.save();
    try { mode === 'fx' ? drawFx(e) : drawModel(e); } catch (err) {
      ctx.restore(); ctx.fillStyle = '#ff8a80'; ctx.font = '13px sans-serif';
      ctx.fillText('오류: ' + err.message, 10, 22); effects.length = 0;
      requestAnimationFrame(frame); return;
    }
    ctx.restore();
  }
  requestAnimationFrame(frame);
}
loadPics(); paintPics(); paintCat(); sync(); fire(180, 168);
requestAnimationFrame(frame);
</script>
