<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>🧰 버튼 편집기 — 구예준 STUDIO</title>
<style>
  * { box-sizing:border-box; }
  body { margin:0; background:#1c2333; color:#fff; font-family:'Malgun Gothic',sans-serif;
         display:flex; flex-direction:column; align-items:center; gap:9px;
         padding:12px 12px calc(12px + env(safe-area-inset-bottom)); }
  h1 { font-size:17px; margin:0; color:#b388ff; }
  .sub { font-size:12px; color:#9fb0d8; margin:0; text-align:center; line-height:1.6; }
  .panel { width:100%; max-width:430px; display:flex; flex-direction:column; gap:5px; }
  .item { display:flex; align-items:center; gap:6px; background:#242c44; border-radius:9px; padding:7px 9px; }
  .item.off { opacity:.4; }
  .item .nm { flex:1; min-width:0; font-size:13px; font-weight:800; overflow:hidden;
              white-space:nowrap; text-overflow:ellipsis; }
  .item .tag { font-size:10px; color:#8ab4ff; flex:none; }
  .item button { background:#3a4566; border:0; border-radius:7px; color:#fff;
                 padding:5px 8px; font-size:13px; font-weight:800; cursor:pointer; }
  .item button.eye.on { background:#2e7d32; }
  .item button.eye.off { background:#7c2d2d; }
  .row { display:flex; gap:6px; flex-wrap:wrap; justify-content:center; }
  button { background:#3f6ea8; color:#fff; border:0; border-radius:9px;
           padding:9px 14px; font-size:13px; font-weight:800; cursor:pointer; }
  #out { width:100%; max-width:430px; background:#12182a; border:2px solid #6a3fa0; border-radius:10px;
         padding:10px; font-size:12px; line-height:1.7; color:#e1d4ff; white-space:pre-wrap; }
  #preview { width:100%; max-width:430px; background:#0f1626; border-radius:12px; padding:10px;
             display:flex; flex-direction:column; align-items:center; gap:5px; max-height:230px; overflow-y:auto; }
  #preview .pv { padding:7px 18px; border-radius:11px; font-size:13px; font-weight:800;
                 background:#3a4566; color:#fff; }
  #preview .pv.main { background:linear-gradient(180deg,#ffb300,#ff8f00); color:#3a2500; font-size:15px; }
</style>

<h1>🧰 버튼 편집기</h1>
<p class="sub">첫 화면 버튼의 <b>순서를 바꾸고 숨길</b> 수 있어요<br>
  바꾸면 <b>내 폰에는 바로 적용</b>돼요 · 모두에게 적용하려면 [📋 설정 복사]를 클로드에게 주세요</p>

<div id="preview"></div>
<div class="panel" id="list"></div>

<div class="row">
  <button id="save">💾 내 폰에 적용</button>
  <button id="reset" style="background:#3a4566">↺ 처음대로</button>
  <button id="copy">📋 설정 복사</button>
  <button id="back" style="background:#3a4566">← 게임으로</button>
</div>

<div id="out">불러오는 중...</div>

<script>
const $ = id => document.getElementById(id);
const KEY = 'ltd_layout';
let BTNS = [];          // [{id, label}]
let order = [], hidden = [];

// index.html에서 버튼 목록을 직접 읽어온다 (게임이 바뀌어도 자동으로 따라감)
async function loadButtons() {
  try {
    const html = await (await fetch('index.html?lab=' + Date.now())).text();
    const re = /<button id="(ovBtn[A-Za-z0-9]*)"[^>]*>([\s\S]*?)<\/button>/g;
    let m; BTNS = [];
    while ((m = re.exec(html))) {
      const label = m[2].replace(/<[^>]*>/g, '').trim();
      if (label) BTNS.push({ id: m[1], label });
    }
  } catch (e) {
    $('out').textContent = '❌ index.html을 읽지 못했어요: ' + e.message;
    return;
  }
  restore();
}
function restore() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) {}
  const all = BTNS.map(b => b.id);
  order = saved && Array.isArray(saved.order)
    ? saved.order.filter(id => all.includes(id)).concat(all.filter(id => !saved.order.includes(id)))
    : all.slice();
  hidden = saved && Array.isArray(saved.hidden) ? saved.hidden.filter(id => all.includes(id)) : [];
  render();
}
const nameOf = id => (BTNS.find(b => b.id === id) || {}).label || id;

function render() {
  $('list').innerHTML = order.map((id, i) => {
    const off = hidden.includes(id);
    const fixed = id === 'ovBtn';           // 시작하기는 숨길 수 없게
    return `<div class="item ${off ? 'off' : ''}">
      <span class="nm">${nameOf(id)}</span>
      <span class="tag">${id}</span>
      <button data-up="${i}" ${i === 0 ? 'disabled' : ''}>▲</button>
      <button data-down="${i}" ${i === order.length - 1 ? 'disabled' : ''}>▼</button>
      <button class="eye ${off ? 'off' : 'on'}" data-eye="${id}" ${fixed ? 'disabled' : ''}>${off ? '숨김' : '보임'}</button>
    </div>`;
  }).join('');
  $('preview').innerHTML = order.filter(id => !hidden.includes(id))
    .map(id => `<div class="pv ${id === 'ovBtn' ? 'main' : ''}">${nameOf(id)}</div>`).join('');
  $('out').textContent = `보이는 버튼 ${order.length - hidden.length}개 / 전체 ${order.length}개` +
    (hidden.length ? `\n숨김: ${hidden.map(nameOf).join(', ')}` : '');
}
$('list').onclick = ev => {
  const b = ev.target.closest('button'); if (!b || b.disabled) return;
  const d = b.dataset;
  if (d.up !== undefined) { const i = +d.up; [order[i - 1], order[i]] = [order[i], order[i - 1]]; }
  else if (d.down !== undefined) { const i = +d.down; [order[i + 1], order[i]] = [order[i], order[i + 1]]; }
  else if (d.eye) { const i = hidden.indexOf(d.eye); if (i >= 0) hidden.splice(i, 1); else hidden.push(d.eye); }
  render();
};
$('save').onclick = () => {
  try { localStorage.setItem(KEY, JSON.stringify({ order, hidden })); } catch (e) {}
  $('out').textContent = '💾 내 폰에 적용했어요!\n게임으로 돌아가면 바로 보입니다.';
};
$('reset').onclick = () => {
  try { localStorage.removeItem(KEY); } catch (e) {}
  restore();
  $('out').textContent = '↺ 처음 상태로 되돌렸어요';
};
$('copy').onclick = () => {
  const txt = '🧰 버튼 배치 설정\n순서: ' + order.map(nameOf).join(' / ') +
    '\n숨김: ' + (hidden.length ? hidden.map(nameOf).join(' / ') : '없음') +
    '\n(id 순서: ' + order.join(',') + ')' +
    '\n(숨김 id: ' + (hidden.join(',') || '없음') + ')';
  navigator.clipboard && navigator.clipboard.writeText(txt).catch(() => {});
  $('out').textContent = txt + '\n\n📋 복사했어요! 클로드에게 붙여넣으면\n모든 유저에게 적용해줍니다.';
};
$('back').onclick = () => { location.href = 'index.html'; };
loadButtons();
</script>
