<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>🧰 버튼 편집기 — 구예준 STUDIO</title>
<style>
  * { box-sizing:border-box; }
  body { margin:0; background:#1c2333; color:#fff; font-family:'Malgun Gothic',sans-serif;
         display:flex; flex-direction:column; align-items:center; gap:8px;
         padding:10px 10px calc(10px + env(safe-area-inset-bottom)); }
  h1 { font-size:16px; margin:0; color:#b388ff; }
  .sub { font-size:11px; color:#9fb0d8; margin:0; text-align:center; line-height:1.6; }

  /* 폰 화면 흉내 — 이 안에서 버튼을 끌어다 놓는다 */
  #screen { position:relative; width:100%; max-width:340px; aspect-ratio:9/16;
            background:rgba(10,14,26,.94); border:2px solid #3a4566; border-radius:16px;
            overflow:hidden; touch-action:none; user-select:none; }
  #screen.grid { background-image:linear-gradient(#ffffff10 1px,transparent 1px),
                                  linear-gradient(90deg,#ffffff10 1px,transparent 1px);
                 background-size:10% 5%; }
  #title { position:absolute; left:0; right:0; top:4%; text-align:center; font-size:15px;
           font-weight:900; color:#ffd76e; pointer-events:none; }
  #msg { position:absolute; left:8%; right:8%; top:11%; text-align:center; font-size:9px;
         color:#9fb0d8; line-height:1.5; pointer-events:none; }
  .btn { position:absolute; transform:translate(-50%,-50%); white-space:nowrap;
         padding:5px 10px; border-radius:9px; font-size:10px; font-weight:800;
         background:#3a4566; color:#fff; cursor:grab; border:1px solid #ffffff22; }
  .btn.main { background:linear-gradient(180deg,#ffb300,#ff8f00); color:#3a2500; font-size:12px; padding:7px 14px; }
  .btn.drag { cursor:grabbing; box-shadow:0 0 0 2px #8ab4ff; z-index:5; }
  .btn.off { opacity:.28; text-decoration:line-through; }
  .btn.sel { box-shadow:0 0 0 2px #ffd54f; }

  .panel { width:100%; max-width:340px; display:flex; flex-direction:column; gap:5px; }
  .row { display:flex; gap:5px; flex-wrap:wrap; justify-content:center; }
  button { background:#3f6ea8; color:#fff; border:0; border-radius:9px;
           padding:8px 12px; font-size:12px; font-weight:800; cursor:pointer; }
  button.gray { background:#3a4566; }
  button.on { background:#ffd54f; color:#2c0a16; }
  #out { width:100%; max-width:340px; background:#12182a; border:2px solid #6a3fa0; border-radius:10px;
         padding:9px; font-size:11px; line-height:1.6; color:#e1d4ff; white-space:pre-wrap; }
  #picked { font-size:12px; font-weight:800; color:#ffd54f; text-align:center; min-height:16px; }
</style>

<h1>🧰 버튼 편집기</h1>
<p class="sub">버튼을 <b>손가락(마우스)으로 끌어서</b> 원하는 자리에 놓으세요<br>
  누르면 선택돼요 · 선택한 버튼은 아래에서 숨기거나 되돌릴 수 있어요</p>

<div id="screen" class="grid">
  <div id="title">🏰 타워 디펜스 777</div>
  <div id="msg">골드로 랜덤 캐릭터를 소환하고<br>같은 캐릭터를 합성해서 더 강하게!</div>
</div>

<div id="picked"></div>

<div class="panel">
  <div class="row">
    <button id="hideBtn" class="gray">🙈 숨기기</button>
    <button id="snapBtn" class="on">🧲 격자에 맞추기</button>
    <button id="gridBtn" class="gray">▦ 격자 보기</button>
  </div>
  <div class="row">
    <button id="autoBtn" class="gray">↕️ 세로로 자동정렬</button>
    <button id="reset" class="gray">↺ 처음대로</button>
  </div>
  <div class="row">
    <button id="save">💾 내 폰에 적용</button>
    <button id="copy">📋 설정 복사</button>
    <button id="back" class="gray">← 게임으로</button>
  </div>
</div>

<div id="out">불러오는 중...</div>

<script>
const $ = id => document.getElementById(id);
const KEY = 'ltd_layout';
let BTNS = [];                 // [{id,label}]
let pos = {}, hidden = [], sel = null;
let snap = true, showGrid = true;

async function loadButtons() {
  try {
    const html = await (await fetch('index.html?lab=' + Date.now())).text();
    const re = /<button id="(ovBtn[A-Za-z0-9]*)"[^>]*>([\s\S]*?)<\/button>/g;
    let m; BTNS = [];
    while ((m = re.exec(html))) {
      const label = m[2].replace(/<[^>]*>/g, '').trim();
      if (label) BTNS.push({ id: m[1], label });
    }
  } catch (e) { $('out').textContent = '❌ index.html을 못 읽었어요: ' + e.message; return; }
  restore();
}
function defaultPos() {                 // 처음엔 세로로 가지런히
  const p = {};
  const n = BTNS.length;
  BTNS.forEach((b, i) => { p[b.id] = [50, 20 + (i / Math.max(1, n - 1)) * 74]; });
  return p;
}
function restore() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) {}
  pos = (saved && saved.pos) ? { ...defaultPos(), ...saved.pos } : defaultPos();
  hidden = (saved && Array.isArray(saved.hidden)) ? saved.hidden.slice() : [];
  sel = null;
  render();
}
const nameOf = id => (BTNS.find(b => b.id === id) || {}).label || id;

function render() {
  const scr = $('screen');
  [...scr.querySelectorAll('.btn')].forEach(e => e.remove());
  for (const b of BTNS) {
    const [x, y] = pos[b.id] || [50, 50];
    const el = document.createElement('div');
    el.className = 'btn' + (b.id === 'ovBtn' ? ' main' : '')
      + (hidden.includes(b.id) ? ' off' : '') + (sel === b.id ? ' sel' : '');
    el.dataset.id = b.id;
    el.style.left = x + '%'; el.style.top = y + '%';
    el.textContent = b.label;
    scr.appendChild(el);
  }
  scr.classList.toggle('grid', showGrid);
  $('snapBtn').classList.toggle('on', snap);
  $('gridBtn').classList.toggle('on', showGrid);
  $('picked').textContent = sel ? `선택: ${nameOf(sel)}` : '버튼을 눌러 선택하세요';
  $('hideBtn').textContent = sel && hidden.includes(sel) ? '👁 다시 보이기' : '🙈 숨기기';
  $('hideBtn').disabled = !sel || sel === 'ovBtn';
  $('out').textContent = `버튼 ${BTNS.length}개 · 보이는 것 ${BTNS.length - hidden.length}개`
    + (hidden.length ? `\n숨김: ${hidden.map(nameOf).join(', ')}` : '');
}

/* ── 끌어서 옮기기 ── */
let drag = null;
$('screen').addEventListener('pointerdown', ev => {
  const el = ev.target.closest('.btn'); if (!el) { sel = null; render(); return; }
  const r = $('screen').getBoundingClientRect();
  sel = el.dataset.id;
  drag = { id: sel, el, r, moved: false };
  el.classList.add('drag');
  el.setPointerCapture(ev.pointerId);
  render();
  // render가 새로 그리므로 다시 잡아준다
  drag.el = $('screen').querySelector(`.btn[data-id="${sel}"]`);
  drag.el.classList.add('drag');
});
$('screen').addEventListener('pointermove', ev => {
  if (!drag) return;
  const r = drag.r;
  let x = ((ev.clientX - r.left) / r.width) * 100;
  let y = ((ev.clientY - r.top) / r.height) * 100;
  x = Math.max(4, Math.min(96, x));
  y = Math.max(3, Math.min(97, y));
  if (snap) { x = Math.round(x / 5) * 5; y = Math.round(y / 2.5) * 2.5; }
  pos[drag.id] = [+x.toFixed(1), +y.toFixed(1)];
  drag.el.style.left = x + '%'; drag.el.style.top = y + '%';
  drag.moved = true;
});
const endDrag = () => { if (!drag) return; drag.el.classList.remove('drag'); drag = null; render(); };
$('screen').addEventListener('pointerup', endDrag);
$('screen').addEventListener('pointercancel', endDrag);

/* ── 버튼들 ── */
$('hideBtn').onclick = () => {
  if (!sel || sel === 'ovBtn') return;
  const i = hidden.indexOf(sel);
  if (i >= 0) hidden.splice(i, 1); else hidden.push(sel);
  render();
};
$('snapBtn').onclick = () => { snap = !snap; render(); };
$('gridBtn').onclick = () => { showGrid = !showGrid; render(); };
$('autoBtn').onclick = () => {
  const vis = BTNS.map(b => b.id).filter(id => !hidden.includes(id));
  vis.forEach((id, i) => { pos[id] = [50, 20 + (i / Math.max(1, vis.length - 1)) * 74]; });
  render();
};
$('reset').onclick = () => { try { localStorage.removeItem(KEY); } catch (e) {} restore();
  $('out').textContent = '↺ 처음 상태로 되돌렸어요'; };
$('save').onclick = () => {
  try { localStorage.setItem(KEY, JSON.stringify({ pos, hidden })); } catch (e) {}
  $('out').textContent = '💾 내 폰에 적용했어요!\n[← 게임으로]를 누르면 바로 보입니다.';
};
$('copy').onclick = () => {
  const lines = BTNS.map(b => `${b.label} → ${pos[b.id][0]}%, ${pos[b.id][1]}%`
    + (hidden.includes(b.id) ? ' (숨김)' : ''));
  const txt = '🧰 버튼 배치 설정 (가로%, 세로%)\n' + lines.join('\n')
    + '\n\nJSON: ' + JSON.stringify({ pos, hidden });
  navigator.clipboard && navigator.clipboard.writeText(txt).catch(() => {});
  $('out').textContent = txt.slice(0, 400) + '\n\n📋 복사했어요! 클로드에게 주면 모두에게 적용됩니다.';
};
$('back').onclick = () => { location.href = 'index.html'; };
loadButtons();
</script>
